name: Offline regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated tests (no VMs, model, Telegram or firewall)
        run: python -m unittest discover -s tests -q
      - name: Audit publishable files and documentation links
        run: python tools/check_release.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check dashboard JavaScript
        run: |
          node --check web/app.js
          node --check web/experiments.js
